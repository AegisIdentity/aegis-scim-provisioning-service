server:
  port: 9106

spring:
  flyway:
    enabled: true
    # Pre-Flyway databases already have these tables (they were created by
    # ddl-auto). Baselining marks them at the baseline version and skips V1
    # instead of replaying it and failing on "relation already exists".
    baseline-on-migrate: true
  application:
    name: aegis-scim-provisioning-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aegis_scim}
    username: ${POSTGRES_USER:aegis}
    password: ${POSTGRES_PASSWORD:dev-only-change-me}
  jpa:
    hibernate:
      # Ship a safe default (validate): production runs versioned migrations (Flyway) and must never let
      # Hibernate mutate the schema. Local dev can set SPRING_JPA_DDL_AUTO=update; tests override to
      # create-drop (src/test/resources/application.yml).
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    open-in-view: false

aegis:
  security:
    # Set true (prod/stage do this via SPRING_PROFILES_ACTIVE) to force real external secrets/keys.
    require-external-secrets: ${AEGIS_REQUIRE_EXTERNAL_SECRETS:false}
  jwt:
    # Keys fetched in-network; issuers validated against an allowlist (Docker split-horizon — see
    # ResourceServerJwtConfig). In Docker, AEGIS_JWKS_URI = http://authorization-server:9000/oauth2/jwks.
    jwk-set-uri: ${AEGIS_JWKS_URI:http://localhost:9000/oauth2/jwks}
    accepted-issuers: ${AEGIS_ACCEPTED_ISSUERS:http://localhost:9000,http://authorization-server:9000}
  as:
    # Authorization-server token endpoint (client_credentials) used to obtain a token for calling
    # identity-service. In Docker this is http://authorization-server:9000/oauth2/token.
    token-uri: ${AEGIS_AS_TOKEN_URI:http://localhost:9000/oauth2/token}
  identity-service:
    # identity-service is where provisioned SCIM users are forwarded (create/disable/enable).
    base-url: ${AEGIS_IDENTITY_BASE_URL:http://localhost:9102}
  scim:
    # client_credentials identity used to authenticate this service to identity-service.
    client-id: ${AEGIS_SCIM_CLIENT_ID:aegis-scim}
    client-secret: ${AEGIS_SCIM_CLIENT_SECRET:dev-only-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
